# Continuous integration: lint, types, unit, integration (real Postgres with RLS),
# production build, client-bundle secret scan, end-to-end tests and dependency audit.
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI-only throwaway credentials for the ephemeral service database.
  DATABASE_URL: postgres://chta_app:ci_app@localhost:5432/chta
  SYSTEM_DATABASE_URL: postgres://chta_system:ci_system@localhost:5432/chta
  MIGRATION_DATABASE_URL: postgres://chta_owner:ci_owner@localhost:5432/chta
  APP_URL: http://localhost:3000
  ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY || 'Y2ktb25seS1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcyE=' }}
  CRON_SECRET: ci-cron-secret-not-used-in-production
  EMAIL_PROVIDER: console
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create roles and databases
        env:
          PGPASSWORD: postgres
        run: |
          for db in chta chta_test; do
            psql -h localhost -U postgres -v owner_pw=ci_owner -v app_pw=ci_app -v system_pw=ci_system -v db=$db -f scripts/db/setup-roles.sql
          done
          printf 'DATABASE_URL=postgres://chta_app:ci_app@localhost:5432/chta_test\nSYSTEM_DATABASE_URL=postgres://chta_system:ci_system@localhost:5432/chta_test\nMIGRATION_DATABASE_URL=postgres://chta_owner:ci_owner@localhost:5432/chta_test\nAPP_URL=http://localhost:3000\nENCRYPTION_KEY=%s\nEMAIL_PROVIDER=console\nSTORAGE_DIR=/tmp/chta-storage-test\n' "$ENCRYPTION_KEY" > .env.test
          printf 'DATABASE_URL=%s\nSYSTEM_DATABASE_URL=%s\nMIGRATION_DATABASE_URL=%s\nAPP_URL=%s\nENCRYPTION_KEY=%s\nCRON_SECRET=%s\nEMAIL_PROVIDER=console\n' "$DATABASE_URL" "$SYSTEM_DATABASE_URL" "$MIGRATION_DATABASE_URL" "$APP_URL" "$ENCRYPTION_KEY" "$CRON_SECRET" > .env.local
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - name: Scan client bundle for secrets
        run: |
          if grep -rlE "SYSTEM_DATABASE_URL|MIGRATION_DATABASE_URL|STRIPE_SECRET|STRIPE_WEBHOOK|ANTHROPIC_API_KEY|TWILIO_AUTH|S3_SECRET|ci_system|ci_owner|ci_app" .next/static; then
            echo "Secret-like strings found in client bundle"; exit 1; fi
      - name: Seed demo data and run end-to-end tests
        run: |
          npm run db:reset
          npx playwright install --with-deps chromium
          (scripts/e2e-server.sh > /tmp/next.log 2>&1 &)
          npx wait-on -t 60000 http://localhost:3000/api/health
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results/
            /tmp/next.log
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=critical
